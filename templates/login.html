{% extends "base.html" %}

{% block title %}
    Вход
{% endblock %}

{% block content %}
    <div class="card" style="max-width: 420px; margin: 0 auto;">
        <h1>Вход</h1>

        <form method="post">
            <label>
                Логин
                <input
                    type="text"
                    name="username"
                    required
                    value="{{ request.form.get('username', '') }}"
                >
            </label>

            <label>
                Пароль
                <input
                    type="password"
                    name="password"
                    required
                >
            </label>

            <button type="submit">
                Войти
            </button>
        </form>

        <p>
            Нет аккаунта?
            <a href="{{ url_for('register') }}">Зарегистрироваться</a>
        </p>
    </div>
{% endblock %}
