{% extends "base.html" %}

{% block title %}
    Редактирование профиля
{% endblock %}

{% block content %}
    <div class="card" style="max-width: 640px; margin: 0 auto;">
        <h1>Редактирование профиля</h1>

        <form method="post" enctype="multipart/form-data">
            <label>
                О себе
                <textarea name="bio" rows="5">{{ current_user.bio }}</textarea>
            </label>

            <label>
                Фото профиля
                <input
                    class="file-input"
                    type="file"
                    name="avatar"
                    accept="image/*"
                >
            </label>

            {% if current_user.avatar_filename %}
                <p>Текущее фото:</p>

                <img
                    class="avatar"
                    src="{{ url_for('uploaded_file', filename=current_user.avatar_filename) }}"
                    alt="Текущее фото"
                >
            {% endif %}

            <br>

            <button type="submit">
                Сохранить
            </button>
        </form>

        <p>
            <a href="{{ url_for('profile', username=current_user.username) }}">
                Назад к профилю
            </a>
        </p>
    </div>
{% endblock %}
