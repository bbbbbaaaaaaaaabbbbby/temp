{% extends "base.html" %}

{% block title %}
    Пользователи
{% endblock %}

{% block content %}
    <div class="card">
        <h1>Пользователи</h1>

        {% if users %}
            <ul>
                {% for user in users %}
                    <li>
                        <a href="{{ url_for('profile', username=user.username) }}">
                            {{ user.username }}
                        </a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>Пока никто не зарегистрирован.</p>
        {% endif %}
    </div>
{% endblock %}
